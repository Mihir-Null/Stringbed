name: workbench checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix with a working runner store
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install platform test services
        run: sudo apt-get update && sudo apt-get install -y racket xvfb openssh-server
      - name: Verify Nix store access
        run: nix store ping
      - name: Model, command, Nix parser, GUI and terminal checks
        run: nix develop --command bash tests/check.sh
      - name: Locked NixOS and integrated Home Manager queries
        run: bash tests/real-nix.sh
      - name: Independent fleet module contract
        run: bash tests/fleet-library.sh
      - name: Disposable SSH transport (no activation)
        run: sudo bash tests/remote-fixture.sh
